---
# Upload TLS files from the Ansible control machine to the target host.
#
# Include with these variables:
#   tls_group  Group that must be able to read the private keys. Created when
#              it does not exist yet, so the upload can run before the role
#              that installs the service.
#   tls_files  List of {src, dest, private}. Set private: true for keys.
#
# All files are owned by root. Certificates are world readable (0644).
# Private keys are readable by root and tls_group only (0640). PostgreSQL
# accepts a key owned by root when its mode is 0640 or stricter.
#
# The copy task registers _tls_upload, so the calling play can restart the
# service when a file changed. The tasks escalate privileges themselves,
# because not every calling play runs with become.

- name: "TLS | Create group {{ tls_group }}"
  group:
    name: "{{ tls_group }}"
    system: true
    state: present
  become: true

- name: TLS | Create certificate directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ tls_group }}"
    mode: "0750"
  loop: "{{ tls_files | map(attribute='dest') | map('dirname') | unique | list }}"
  become: true

- name: TLS | Upload certificates and private keys
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ tls_group }}"
    mode: "{{ '0640' if item.private | default(false) | bool else '0644' }}"
  loop: "{{ tls_files }}"
  loop_control:
    label: "{{ item.src | basename }} -> {{ item.dest }}"
  register: _tls_upload
  become: true
