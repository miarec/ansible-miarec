---
## -------------------------------
## Apache options
## -------------------------------
apache_listen_ip: "*"
apache_listen_port: 80
# apache_listen_port_ssl: 443

# On Debian/Ubuntu, a default virtualhost is included in Apache's configuration. Set this to true to remove that default virtualhost configuration file.
apache_remove_default_vhost: true

## -------------------------------
## Python options
## -------------------------------
python_verify_gpg_signature: true

python_cleanup_downloads: true
python_force_install: false

# Download the required sox components from MiaRec web-site to avoid dependencies on sourceforge.net and other sites
sox_download_url: "https://miarec-download.s3.amazonaws.com/sox-{{ sox_version }}.tar.gz"
libmad_download_url: "https://miarec-download.s3.amazonaws.com/libmad-{{ libmad_version }}.tar.gz"
libogg_download_url: "https://miarec-download.s3.amazonaws.com/libogg-{{ libogg_version }}.tar.gz"
flac_download_url: "https://miarec-download.s3.amazonaws.com/flac-{{ flac_version }}.tar.xz"
lame_download_url: "https://miarec-download.s3.amazonaws.com/lame-{{ lame_version }}.tar.gz"



## -------------------------------
## Service users
## -------------------------------
# By default, Celery runs as root and the files are owned by root:root.
# To run as dedicated accounts, set these in vars/custom.yml or in the
# inventory. The roles create the users and groups when they do not exist.
# Apache is added to miarec_bin_group so it can read production.ini and the
# TLS private keys. TLS with client certificates requires a non-root Celery user.
#
# miarecweb_celery_user: celery
# miarec_bin_group: miarec

## -------------------------------
## Celery health probe
## -------------------------------
# /health/celery/probe sends a task to a Celery worker and reports whether the
# worker ran it. By default, only the web host itself may call it. To let a
# monitoring service call it, list its addresses or networks in
# vars/custom.yml or in the inventory:
#
# miarecweb_celery_probe_hosts:
#   - 127.0.0.1
#   - ::1
#   - 10.0.0.0/24

## -------------------------------
## TLS Options
## -------------------------------
# miarecweb_db_tls is in vars/db.yml.
miarecweb_redis_tls: "{{ redis_tls | default(False) | bool }}"

miarecweb_db_tls_ca_file: /etc/miarecweb/tls/db-ca.crt
miarecweb_db_tls_cert_file: /etc/miarecweb/tls/db-client.crt
miarecweb_db_tls_key_file: /etc/miarecweb/tls/db-client.key
miarecweb_redis_tls_ca_file: /etc/miarecweb/tls/redis-ca.crt
miarecweb_redis_tls_cert_file: /etc/miarecweb/tls/redis-client.crt
miarecweb_redis_tls_key_file: /etc/miarecweb/tls/redis-client.key
