# ------------------------------------------------
# Deploy MiaRec Web UI and celery task manager
# ------------------------------------------------
- name: Deploy MiaRec Web application
  hosts:
    - web
    - celery
    - celerybeat
  vars_files:
    - vars/db.yml
    - vars/web.yml
    - vars/tls.yml
  pre_tasks:
    - name: Include custom vars
      include_vars: vars/custom.yml
      failed_when: false

    - name: Define install variables
      set_fact:
        miarecweb_db_host: "{{ hostvars[groups.db.0].private_ip_address }}"
        miarecweb_redis_host: "{{ hostvars[groups.redis.0].private_ip_address }}"
        miarecweb_install_apache: "{{ 'web' in group_names }}"
        miarecweb_install_celeryd: "{{ 'celery' in group_names }}"
        miarecweb_install_celerybeat: "{{ 'celerybeat' in group_names }}"

    - name: Configure MiaRec Web TLS settings
      set_fact:
        miarecweb_db_tls: >-
          {{
            (postgresql_ssl | default(false) | bool) or
            (
              (install_pgbouncer | default(false) | bool) and
              (pgbouncer_client_tls | default(false) | bool)
            )
          }}
        miarecweb_db_tls_sslmode: "{{ ((install_pgbouncer | default(false) | bool) and (pgbouncer_client_tls | default(false) | bool)) | ternary(pgbouncer_client_tls_sslmode | default('require'), 'verify-ca' if postgresql_ssl_require_clientcert | default(true) | bool else 'require') }}"
        miarecweb_redis_tls: "{{ redis_tls | default(false) | bool }}"
        miarecweb_redis_tls_cert_reqs: "{{ 'required' if (redis_tls | default(false) | bool) and (redis_tls_auth_clients | default(true) | bool) else 'optional' }}"


    - debug: var=miarecweb_db_host
    - debug: var=miarecweb_redis_host

    # The role defaults are not visible in pre_tasks, so repeat the default here.
    - name: Upload MiaRec Web TLS certificates
      include_tasks: tasks/upload-tls-certs.yml
      vars:
        tls_group: "{{ miarec_bin_group | default('root') }}"
        _db_files:
          - src: "{{ miarecweb_db_tls_ca_file_src }}"
            dest: "{{ miarecweb_db_tls_ca_file }}"
          - src: "{{ miarecweb_db_tls_cert_file_src }}"
            dest: "{{ miarecweb_db_tls_cert_file }}"
          - src: "{{ miarecweb_db_tls_key_file_src }}"
            dest: "{{ miarecweb_db_tls_key_file }}"
            private: true
        _redis_files:
          - src: "{{ miarecweb_redis_tls_ca_file_src }}"
            dest: "{{ miarecweb_redis_tls_ca_file }}"
          - src: "{{ miarecweb_redis_tls_cert_file_src }}"
            dest: "{{ miarecweb_redis_tls_cert_file }}"
          - src: "{{ miarecweb_redis_tls_key_file_src }}"
            dest: "{{ miarecweb_redis_tls_key_file }}"
            private: true
        tls_files: "{{ (_db_files if miarecweb_db_tls | bool else []) + (_redis_files if miarecweb_redis_tls | bool else []) }}"
      when: miarecweb_db_tls | bool or miarecweb_redis_tls | bool

  roles:
    - role: 'miarecweb'

  post_tasks:
    # The role reloads the services only when production.ini changes.
    - name: Reload MiaRec Web services when TLS certificates changed
      debug:
        msg: TLS certificates changed, Apache and Celery reload at the end of the play
      changed_when: true
      notify:
        - reload apache
        - reload celeryd
        - reload celerybeat
      when: _tls_upload is defined and _tls_upload is changed

  tags: 'miarecweb'


# ------------------------------------------------
# Deploy MiaRec Recorder
# ------------------------------------------------
- name: Deploy MiaRec Recorder application
  hosts: recorder
  vars_files:
    - vars/db.yml
    - vars/recorder.yml
    - vars/tls.yml

  pre_tasks:
    - name: Include custom vars
      include_vars: vars/custom.yml
      failed_when: false

    - set_fact:
        miarec_db_host: "{{ hostvars[groups.db.0].private_ip_address }}"
        miarec_redis_host: "{{ hostvars[groups.redis.0].private_ip_address }}"
        miarec_http_call_events_host: "{{ hostvars[groups.web.0].private_ip_address }}"
        # Web and Celery hosts call the REST API
        miarec_rest_api_permitted_hosts: "{{ (groups['web'] | default([]) + groups['celery'] | default([])) | map('extract', hostvars, ['private_ip_address']) | unique | join(';') }}"

    - name: Configure MiaRec Recorder TLS settings
      set_fact:
        miarec_db_use_ssl: >-
          {{
            (postgresql_ssl | default(false) | bool) or
            (
              (install_pgbouncer | default(false) | bool) and
              (pgbouncer_client_tls | default(false) | bool)
            )
          }}
        miarec_redis_use_ssl: "{{ redis_tls | default(false) | bool }}"

    - debug: var=miarec_db_host
    - debug: var=miarec_redis_host
    - debug: var=miarec_http_call_events_host
    - debug: var=miarec_rest_api_permitted_hosts

    - name: Upload MiaRec Recorder TLS certificates
      include_tasks: tasks/upload-tls-certs.yml
      vars:
        tls_group: "{{ miarec_bin_group | default('root') }}"
        _db_files:
          - src: "{{ miarec_db_tls_ca_file_src }}"
            dest: "{{ miarec_db_tls_ca_file }}"
          - src: "{{ miarec_db_tls_cert_file_src }}"
            dest: "{{ miarec_db_tls_cert_file }}"
          - src: "{{ miarec_db_tls_key_file_src }}"
            dest: "{{ miarec_db_tls_key_file }}"
            private: true
        _redis_files:
          - src: "{{ miarec_redis_tls_ca_file_src }}"
            dest: "{{ miarec_redis_tls_ca_file }}"
          - src: "{{ miarec_redis_tls_cert_file_src }}"
            dest: "{{ miarec_redis_tls_cert_file }}"
          - src: "{{ miarec_redis_tls_key_file_src }}"
            dest: "{{ miarec_redis_tls_key_file }}"
            private: true
        tls_files: "{{ (_db_files if miarec_db_use_ssl | bool else []) + (_redis_files if miarec_redis_use_ssl | bool else []) }}"
      when: miarec_db_use_ssl | bool or miarec_redis_use_ssl | bool

  roles:
    - role: 'miarec'

  post_tasks:
    - name: Restart MiaRec Recorder when TLS certificates changed
      debug:
        msg: TLS certificates changed, the recorder restarts at the end of the play
      changed_when: true
      notify: Restart miarec
      when: _tls_upload is defined and _tls_upload is changed

  tags: 'miarec'

# ------------------------------------------------
# Deploy MiaRec Screen Controller
# ------------------------------------------------
- name: Deploy MiaRec Screen Controller
  hosts: screen
  vars_files:
    - vars/db.yml
    # The screen controller shares the miarec_db_* and miarec_redis_* variables
    # with the recorder, so it uses the recorder's TLS files. On a host that
    # runs both, the paths must be the same.
    - vars/recorder.yml
    - vars/tls.yml
  pre_tasks:
    - name: Include custom vars
      include_vars: vars/custom.yml
      failed_when: false

    - set_fact:
        miarec_db_host: "{{ hostvars[groups.db.0].private_ip_address }}"
        miarec_redis_host: "{{ hostvars[groups.redis.0].private_ip_address }}"
        # Web and Celery hosts call the REST API
        miarec_rest_api_permitted_hosts: "{{ (groups['web'] | default([]) + groups['celery'] | default([])) | map('extract', hostvars, ['private_ip_address']) | unique | join(';') }}"

    - name: Configure MiaRec Screen Controller TLS settings
      set_fact:
        miarec_db_use_ssl: >-
          {{
            (postgresql_ssl | default(false) | bool) or
            (
              (install_pgbouncer | default(false) | bool) and
              (pgbouncer_client_tls | default(false) | bool)
            )
          }}
        miarec_redis_use_ssl: "{{ redis_tls | default(false) | bool }}"

    - debug: var=miarec_db_host
    - debug: var=miarec_redis_host
    - debug: var=miarec_rest_api_permitted_hosts

    # The role defaults are not visible in pre_tasks, so repeat the default here.
    - name: Upload MiaRec Screen Controller TLS certificates
      include_tasks: tasks/upload-tls-certs.yml
      vars:
        tls_group: "{{ miarec_screen_bin_group | default('root') }}"
        _db_files:
          - src: "{{ miarec_db_tls_ca_file_src }}"
            dest: "{{ miarec_db_tls_ca_file }}"
          - src: "{{ miarec_db_tls_cert_file_src }}"
            dest: "{{ miarec_db_tls_cert_file }}"
          - src: "{{ miarec_db_tls_key_file_src }}"
            dest: "{{ miarec_db_tls_key_file }}"
            private: true
        _redis_files:
          - src: "{{ miarec_redis_tls_ca_file_src }}"
            dest: "{{ miarec_redis_tls_ca_file }}"
          - src: "{{ miarec_redis_tls_cert_file_src }}"
            dest: "{{ miarec_redis_tls_cert_file }}"
          - src: "{{ miarec_redis_tls_key_file_src }}"
            dest: "{{ miarec_redis_tls_key_file }}"
            private: true
        tls_files: "{{ (_db_files if miarec_db_use_ssl | bool else []) + (_redis_files if miarec_redis_use_ssl | bool else []) }}"
      when: miarec_db_use_ssl | bool or miarec_redis_use_ssl | bool

  roles:
    - role: 'miarec-screen'

  post_tasks:
    - name: Restart MiaRec Screen Controller when TLS certificates changed
      debug:
        msg: TLS certificates changed, the screen controller restarts at the end of the play
      changed_when: true
      notify: Restart miarec_screen
      when: _tls_upload is defined and _tls_upload is changed

  tags: 'miarec-screen'


