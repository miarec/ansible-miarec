---
- name: Converge TLS scenario
  hosts: all
  vars:
    molecule_python_version: "{{ lookup('env', 'MOLECULE_PYTHON_VERSION') | default('', true) }}"

  pre_tasks:
    - name: Set Install Variables
      set_fact:
        private_ip_address: 127.0.0.1
        miarecweb_secret: "{{ lookup('env', 'MIARECWEB_SECRET') }}"
        miarecweb_version: "{{ lookup('env', 'MIARECWEB_VERSION') }}"
        miarec_version: "{{ lookup('env', 'MIAREC_VERSION') }}"
        miarec_screen_version: "{{ lookup('env', 'MIAREC_SCREEN_VERSION') }}"
        miarec_livemon_version: "{{ lookup('env', 'MIAREC_LIVEMON_VERSION') }}"
        postgresql_version: "{{ lookup('env', 'POSTGRESQL_VERSION') }}"
        install_pgbouncer: true
        redis_install_from_source: false
        python_install_from_source: false
        sox_install_from_source: false
        # TLS configuration variables
        # postgresql_tls
        postgresql_tls: true
        postgresql_tls_cert_file: /etc/postgresql/tls/server.crt
        postgresql_tls_key_file: /etc/postgresql/tls/server.key
        postgresql_tls_ca_file: /etc/postgresql/tls/ca.crt
        postgresql_tls_require_clientcert: true
        # pgbouncer_client_tls
        pgbouncer_client_tls: true
        pgbouncer_client_tls_cert_file: /etc/pgbouncer/tls/server.crt
        pgbouncer_client_tls_key_file: /etc/pgbouncer/tls/server.key
        pgbouncer_client_tls_ca_file: /etc/pgbouncer/tls/ca.crt
        # pgbouncer_server_tls
        pgbouncer_server_tls: true
        pgbouncer_server_tls_cert_file: /etc/pgbouncer/tls/client.crt
        pgbouncer_server_tls_key_file: /etc/pgbouncer/tls/client.key
        pgbouncer_server_tls_ca_file: /etc/pgbouncer/tls/ca.crt
        # redis_tls
        redis_tls: true
        redis_tls_cert_file: /etc/redis/tls/server.crt
        redis_tls_key_file: /etc/redis/tls/server.key
        redis_tls_ca_file: /etc/redis/tls/ca.crt
        redis_tls_auth_clients: true

    - name: Apply MOLECULE_PYTHON_VERSION override when provided
      when: molecule_python_version | length > 0
      set_fact:
        python_version: "{{ molecule_python_version }}"

    - name: Set python_version default for Rocky/RHEL hosts
      when:
        - ansible_facts['os_family'] == "RedHat"
        - molecule_python_version | length == 0
      set_fact:
        python_version: "3.12"


- name: Run prepare-hosts playbook
  import_playbook: ../../prepare-hosts.yml

- name: Run setup-miarec playbook
  import_playbook: ../../setup-miarec.yml
