---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ansible-miarec-tls-${MOLECULE_DISTRO:-ubuntu2404}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - recorder
      - livemon
      - screen
      - db
      - redis
      - web
      - celery
      - celerybeat
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  env:
    ANSIBLE_VERBOSITY: ${MOLECULE_ANSIBLE_VERBOSITY:-0}
    MOLECULE_DISTRO: ${MOLECULE_DISTRO:-ubuntu2404}

verifier:
  name: testinfra
  directory: tests
  options:
    s: true
    verbose: true
