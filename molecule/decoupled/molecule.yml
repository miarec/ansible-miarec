---
# Decoupled deployment: each tier runs in its own container on one Docker
# network, like the inventory in the installation guide. Six containers:
#
#   db      - PostgreSQL and PGBouncer
#   redis   - Redis
#   web     - Apache, miarecweb and live monitoring
#   celery  - Celery worker and Celery beat
#   rec     - call recorder
#   screen  - screen recording controller
dependency:
  name: galaxy

driver:
  name: docker

# The driver creates the network named under each platform.
# MOLECULE_INSTANCE_SUFFIX (empty by default) tells apart the containers of
# two configurations of this scenario on the same distro, so both can run at
# the same time. The Makefile sets it, see `make help`.

platforms:
  - name: ansible-miarec-dec-db-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - db
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: ansible-miarec-dec-redis-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - redis
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: ansible-miarec-dec-web-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - web
      - livemon
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: ansible-miarec-dec-celery-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - celery
      - celerybeat
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: ansible-miarec-dec-rec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - recorder
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

  - name: ansible-miarec-dec-screen-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - screen
    networks:
      - name: ansible-miarec-dec-${MOLECULE_DISTRO:-ubuntu2404}${MOLECULE_INSTANCE_SUFFIX}
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  # The roles run the services as root by default. Run them as dedicated
  # users here, so the scenario checks file ownership and permissions.
  inventory:
    group_vars:
      all:
        miarec_bin_user: miarec
        miarec_bin_group: miarec
        miarec_screen_bin_user: miarec
        miarec_screen_bin_group: miarec
        miarecweb_celery_user: celery
        miarecweb_celery_group: miarec
        miarec_livemon_bin_user: miarec
        miarec_livemon_bin_group: miarec
  env:
    ANSIBLE_VERBOSITY: ${MOLECULE_ANSIBLE_VERBOSITY:-0}
    MIARECWEB_VERSION: ${MOLECULE_MIARECWEB_VERSION:-"2026.8.24.0"}
    MIARECWEB_SECRET: ${MOLECULE_MIARECWEB_SECRET:-"secret"}
    MIAREC_VERSION: ${MOLECULE_MIAREC_VERSION:-"2026.8.16.0"}
    MIAREC_SCREEN_VERSION: ${MOLECULE_MIAREC_SCREEN_VERSION:-"2026.8.3.0"}
    MIAREC_LIVEMON_VERSION: ${MOLECULE_MIAREC_LIVEMON_VERSION:-"0.1.0.183"}
    POSTGRESQL_VERSION: ${MOLECULE_POSTGRESQL_VERSION:-"15"}
    INSTALL_PGBOUNCER: ${MOLECULE_INSTALL_PGBOUNCER:-"true"}

verifier:
  name: testinfra
  directory: tests
  # PostgreSQL authentication checks shared with the single-host scenarios
  additional_files_or_dirs:
    - ../../default/tests/test_postgresql_auth.py
  options:
    s: true
    verbose: true
