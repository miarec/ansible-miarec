---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ansible-miarec-${MOLECULE_DISTRO:-ubuntu2404}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    groups:
      - recorder
      - livemon
      - screen
      - db
      - redis
      - web
      - celery
      - celerybeat
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  # The roles run the services as root by default. Run them as dedicated
  # users here, so the scenario checks file ownership and permissions.
  inventory:
    group_vars:
      all:
        miarec_bin_user: miarec
        miarec_bin_group: miarec
        miarec_screen_bin_user: miarec
        miarec_screen_bin_group: miarec
        miarecweb_celery_user: celery
        miarecweb_celery_group: miarec
        miarec_livemon_bin_user: miarec
        miarec_livemon_bin_group: miarec
  env:
    ANSIBLE_VERBOSITY: ${MOLECULE_ANSIBLE_VERBOSITY:-0}
    MIARECWEB_VERSION: ${MOLECULE_MIARECWEB_VERSION:-"2026.8.24.0"}
    MIARECWEB_SECRET: ${MOLECULE_MIARECWEB_SECRET:-"secret"}
    MIAREC_VERSION: ${MOLECULE_MIAREC_VERSION:-"2026.8.16.0"}
    MIAREC_SCREEN_VERSION: ${MOLECULE_MIAREC_SCREEN_VERSION:-"2026.8.3.0"}
    MIAREC_LIVEMON_VERSION: ${MOLECULE_MIAREC_LIVEMON_VERSION:-"0.1.0.183"}
    POSTGRESQL_VERSION: ${MOLECULE_POSTGRESQL_VERSION:-"15"}
    INSTALL_PGBOUNCER: ${MOLECULE_INSTALL_PGBOUNCER:-"true"}

verifier:
  name: testinfra
  options:
    s: true
    verbose: true
