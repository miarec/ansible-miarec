---
name: Ansible role testing
'on':
    pull_request:
    push:
        branches:
            - master
        paths-ignore:
            - '**.md'

    schedule:
        - cron: "30 7 1 * *"

    workflow_dispatch:

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest

        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Install Ansible collections
              run: uv run ansible-galaxy collection install community.general

            - name: Run ansible-lint
              run: uv run ansible-lint

    test:
        name: molecule
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                distro:
                    - ubuntu2204
                    - ubuntu2404
                    - rockylinux8
                    - rockylinux9
                    - rhel7
                    - rhel8
                    - rhel9
                # miarecweb_version: ${{ vars.MIARECMEB_VERSION }}
                # miarec_version: ${{ vars.MIAREC_VERSION }}
                # miarec_screen_version: ${{ vars.MIAREC_SCREEN_VERSION }}
                # miarec_livemon_version: ${{ vars.MIAREC_LIVEMON_VERSION }}
                # miarec_python_version: ${{ vars.MIAREC_PYTHON_VERSION }}
                # miarec_postgresql_version: ${{ vars.MIAREC_POSTGRESQL_VERSION }}
                # miarec_redis_version: ${{ vars.MIAREC_REDIS_VERSION }}



                # include:
                #     - distro: ubuntu2204
                #       miarec_version: 7.0.0.111
                #       miarec_screen_version: 1.1.0.49
                #       miarec_version: 7.0.0.110
                #       miarec_screen_version: 1.1.0.48
                #     - distro: centos7
                #       miarec_version: 7.0.0.100
                #       miarec_screen_version: 1.1.0.46
                #     # - distro: rhel7
                #     #   miarec_version: 7.0.0.100
                #     #   miarec_screen_version: 1.1.0.46

        steps:
            - name: Check out the Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Run molecule tests
              run: uv run molecule test
              env:
                  PY_COLORS: '1'
                  ANSIBLE_FORCE_COLOR: '1'
                  MOLECULE_DISTRO: ${{ matrix.distro }}
                  # MOLECULE_MIARECWEB_VERSION: ${{ matrix.miarecweb_version }}
                  # MOLECULE_MIAREC_VERSION: ${{ matrix.miarec_version }}
                  # MOLECULE_MIAREC_SCREEN_VERSION: ${{ matrix.miarec_screen_version }}
                  # MOLECULE_MIAREC_LIVEMON_VERSION: ${{ matrix.miarec_livemon_version }}
                  # MOLECULE_PYTHON_VERSION: ${{ matrix.miarec_python_version }}
                  # MOLECULE_POSTGRESQL_VERSION: ${{ matrix.miarec_postgresql_version }}
                  # MOLECULE_REDIS_VERSION: ${{ matrix.miarec_redis_version }}

    test_tls:
        name: molecule-tls
        runs-on: ubuntu-22.04
        # needs:
        #     - lint
        strategy:
            fail-fast: false
            matrix:
                distro:
                    - ubuntu2204
                    - ubuntu2404
                    - rockylinux9
                    - rhel7
                    - rhel8
                    - rhel9

        steps:
            - name: Check out the Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Run molecule TLS tests
              run: uv run molecule test -s tls
              env:
                  PY_COLORS: '1'
                  ANSIBLE_FORCE_COLOR: '1'
                  MOLECULE_DISTRO: ${{ matrix.distro }}

    test_decoupled:
        name: molecule-decoupled
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                distro:
                    - ubuntu2404
                    - rockylinux9
                    - rhel7
                    - rhel8
                    - rhel9

        steps:
            - name: Check out the Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Run molecule decoupled tests
              run: uv run molecule test -s decoupled
              env:
                  PY_COLORS: '1'
                  ANSIBLE_FORCE_COLOR: '1'
                  MOLECULE_DISTRO: ${{ matrix.distro }}

    test_decoupled_tls:
        name: molecule-decoupled-tls
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                distro:
                    - ubuntu2404
                    - rockylinux9
                    - rhel7
                    - rhel8
                    - rhel9

        steps:
            - name: Check out the Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Run molecule decoupled TLS tests
              run: uv run molecule test -s decoupled-tls
              env:
                  PY_COLORS: '1'
                  ANSIBLE_FORCE_COLOR: '1'
                  MOLECULE_DISTRO: ${{ matrix.distro }}

    # Configurations that production deployments rarely use. One distro is enough.
    test_edge_cases:
        name: molecule-edge-${{ matrix.label }}
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: decoupled-tls-postgresql-ssl
                      scenario: decoupled-tls
                      install_pgbouncer: 'true'
                      postgresql_ssl: 'true'
                    - label: decoupled-tls-no-pgbouncer
                      scenario: decoupled-tls
                      install_pgbouncer: 'false'
                    - label: decoupled-no-pgbouncer
                      scenario: decoupled
                      install_pgbouncer: 'false'
                    - label: tls-no-pgbouncer
                      scenario: tls
                      install_pgbouncer: 'false'
                    - label: default-no-pgbouncer
                      scenario: default
                      install_pgbouncer: 'false'

        steps:
            - name: Check out the Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up uv
              uses: astral-sh/setup-uv@v4

            - name: Run molecule ${{ matrix.scenario }} tests
              run: uv run molecule test -s ${{ matrix.scenario }}
              env:
                  PY_COLORS: '1'
                  ANSIBLE_FORCE_COLOR: '1'
                  MOLECULE_DISTRO: ubuntu2404
                  MOLECULE_INSTALL_PGBOUNCER: ${{ matrix.install_pgbouncer }}
                  # Empty when the entry does not set it: the scenario default applies.
                  MOLECULE_POSTGRESQL_SSL: ${{ matrix.postgresql_ssl }}
